# editor.cfg - Linker config para Editor VI
SYMBOLS {
    __STACKSIZE__: type = weak, value = $0200;
    __STACKSTART__: type = weak, value = $3DFF;
    __CONSTRUCTOR_COUNT__: type = weak, value = 0;
    __DESTRUCTOR_COUNT__: type = weak, value = 0;
}

MEMORY {
    ZP:     start = $0002, size = $00FE, type = rw, define = yes;
    # Variables del editor (g_editor, g_filename...). LORAM va ANTES del
    # codigo en RAM: no puede solaparse con RAM ($0800+).
    LORAM:  start = $0400, size = $0100, type = rw;
    # Buffer de edicion: $36C0-$3DBF. No puede llegar a $3E00 (pila de
    # hardware de la CPU, que usa el monitor y las subrutinas anidadas).
    # Empieza en $36C0 (no en $36E0) para dejar sitio al codigo.
    EDITS:  start = $3800, size = $0600, type = rw;
    # Codigo: $0800-$36BF. La zona de codigo crece hacia arriba: si sube
    # hay que bajar EDIT_BUF_SIZE (que es quien ocupa EDITBSS).
    RAM:    start = $0800, size = $3000, type = rw, file = %O, define = yes;
}

SEGMENTS {
    # El orden importa: STARTUP, CODE, RODATA, DATA, BSS como el monitor.
    # Con RODATA despues de CODE, los literales de cadena se colocan dentro
    # del area de codigo y los simbolos se pisan (zerobss acababa dentro de
    # _mfs_init y el editor saltaba a la ROM al arrancar).
    ZEROPAGE: load = ZP, type = zp, define = yes;
    INIT:     load = RAM, type = ro, optional = yes;
    STARTUP:  load = RAM, type = ro;
    RODATA:   load = RAM, type = ro, optional = yes;
    CODE:     load = RAM, type = ro, optional = yes;
    ONCE:     load = RAM, type = ro, optional = yes;
    DATA:     load = RAM, type = rw, define = yes, optional = yes;
    BSS:      load = LORAM, type = bss, define = yes, optional = yes;
    EDITBSS:  load = EDITS, type = bss, optional = yes;
}
