# ============================================================================
# editor.cfg - Mapa de memoria del Mini VI
# ============================================================================
# $0000-$0001  reservado
# $0002-$001F  ZP del monitor; el programa empieza en $0020
# $0020-$00FF  Zero Page de cc65 y del editor (no se usa la pila simulada)
# $0100-$01FF  pila de hardware (6502): RTS/JSR normales
# $0800-$3DFF  codigo + datos + BSS del editor (fichero cargado por `load`)
# $3E00-$3DFF  TEXTO_BUF (512 B, solo si hiciera falta mas adelante)
# $3FFE-$3FFF  autoboot del monitor: NO tocar
# $8000-$BFFF  ROM del monitor (ROM API en $BF00)
#
# Todo lo que se ejecuta tiene que estar entre $0800 y $3DFF: el hardware solo
# decodifica RAM hasta $3FFF. El BSS viaja dentro del .bin (cero relleno) y
# startup.s lo pone a cero; asi `load EDITOR.BIN 0800` + `r 0800` basta.
# ============================================================================

SYMBOLS {
    __CONSTRUCTOR_COUNT__: type = weak, value = 0;
    __DESTRUCTOR_COUNT__: type = weak, value = 0;
    __CONSTRUCTOR_TABLE__: type = weak, value = $0800;
    __DESTRUCTOR_TABLE__: type = weak, value = $0800;
}

MEMORY {
    ZP:     start = $0020, size = $00D6, type = rw, define = yes;
    RAM:    start = $0800, size = $3600, type = rw, file = %O, define = yes;
    TEXTO:  start = $3E00, size = $1E00, type = rw, define = yes;
}

SEGMENTS {
    ZEROPAGE: load = ZP,  type = zp,  define = yes;
    STARTUP:  load = RAM, type = ro;
    CODE:     load = RAM, type = ro, optional = yes;
    RODATA:   load = RAM, type = ro, optional = yes;
    ONCE:     load = RAM, type = ro, optional = yes;
    DATA:     load = RAM, type = rw, define = yes, optional = yes;
    BSS:      load = RAM, type = bss, define = yes, optional = yes;
    TEXTO_BUF: load = TEXTO, type = bss, define = yes;
}
